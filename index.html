    <!-- Safe fetch property wrapper to prevent "Cannot set property fetch of #<Window> which has only a getter" in sandboxed environments -->
    <script>
      (function() {
        try {
          var nativeFetch = window.fetch;
          var customFetch = nativeFetch ? nativeFetch.bind(window) : undefined;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return customFetch;
              },
              set: function(val) {
                customFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return customFetch;
                },
                set: function(val) {
                  customFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e2) {}
          }
        } catch (e) {}
      })();
    </script>
